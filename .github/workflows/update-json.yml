name: Update data json

permissions:
  contents: write


on:
  push:
    paths:
      - "*.jpg"


jobs:

  update-json:

    runs-on: ubuntu-latest


    steps:


    - name: Checkout

      uses: actions/checkout@v4



    - name: Generate data.json

      run: |

        python3 << 'EOF'

        import json
        import os
        import re


        data = {}



        for file in os.listdir("."):

            if file.endswith(".jpg"):


                name = file[:-4]


                match = re.match(
                    r"(.*?)(上午|下午)\d+$",
                    name
                )


                if match:


                    key = match.group(1) + match.group(2)


                    if key not in data:

                        data[key] = []


                    data[key].append(file)



        for key in data:

            data[key].sort()



        with open(
            "data.json",
            "w",
            encoding="utf-8"
        ) as f:


            json.dump(
                data,
                f,
                ensure_ascii=False,
                indent=2
            )


        EOF




    - name: Commit data.json


      run: |


        git config --global user.name "github-actions"


        git config --global user.email "actions@github.com"



        git add data.json



        git commit -m "Auto update data.json" || exit 0



        git push
